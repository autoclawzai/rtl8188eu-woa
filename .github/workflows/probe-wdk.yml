name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Signatures
        shell: pwsh
        run: |
          try {
            $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"
            $nl = [Environment]::NewLine
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 9) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            function Ctx([string]$file, [string]$pattern, [int]$after, [int]$max) {
              $sel = Select-String -Path $file -Pattern $pattern -Context 0,$after | Select-Object -First $max
              $parts = @()
              foreach ($s in $sel) {
                $t = ($s.Line + ' ' + ($s.Context.PostContext -join ' ')) -replace '\s+',' '
                $parts += ('@@ ' + $t.Trim())
              }
              return ($parts -join "`n")
            }

            $dirs = Get-ChildItem $inc -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
            Emit "kmdirs" ($dirs -join ' ')
            $nd = Get-ChildItem $inc -Directory -Filter '*net*' -ErrorAction SilentlyContinue
            $f = @()
            foreach ($d in $nd) { $f += Get-ChildItem $d.FullName -Recurse -File -Filter *.h -ErrorAction SilentlyContinue }
            Emit "nacfiles" (($f | ForEach-Object { $_.FullName.Replace($inc,'') }) -join "`n")
            $pat = '\b(NET_ADAPTER_TX_CAPABILITIES_INIT\w*|NET_ADAPTER_RX_CAPABILITIES_INIT\w*|NET_PACKET_QUEUE_CONFIG_INIT|NET_ADAPTER_LINK_STATE_INIT|NET_ADAPTER_LINK_LAYER_CAPABILITIES_INIT|NET_ADAPTER_DATAPATH_CALLBACKS_INIT|NetAdapterSetDataPathCapabilities|NetAdapterSetLinkState|NetAdapterSetPermanentLinkLayerAddress|NetAdapterSetCurrentLinkLayerAddress|NetAdapterSetLinkLayerMtuSize|NetTxQueueCreate|NetRxQueueCreate)\b'
            $out = @()
            foreach ($x in ($f | Where-Object { $_.FullName -match '\\(2\.0|1\.\d)\\' -or $true })) { $o = Ctx $x.FullName $pat 9 40; if ($o) { $out += ('#### ' + $x.FullName.Replace($inc,'')); $out += $o } }
            Emit "nacapi" ($out -join "`n")
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
