name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Signatures
        shell: pwsh
        run: |
          try {
            $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"
            $nl = [Environment]::NewLine
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 9) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            function Ctx([string]$file, [string]$pattern, [int]$after, [int]$max) {
              $sel = Select-String -Path $file -Pattern $pattern -Context 0,$after | Select-Object -First $max
              $parts = @()
              foreach ($s in $sel) {
                $t = ($s.Line + ' ' + ($s.Context.PostContext -join ' ')) -replace '\s+',' '
                $parts += ('@@ ' + $t.Trim())
              }
              return ($parts -join "`n")
            }

            $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"
            $names = @('WDI_BYTE_BLOB','WDI_SIGNAL_INFO_CONTAINER','WDI_CHANNEL_INFO_CONTAINER','WDI_MAC_ADDRESS_CONTAINER','WDI_AGE_INFO_CONTAINER','WDI_MAC_ADDRESS','WDI_SSID')
            $out = @()
            $all = Get-ChildItem $root -Recurse -File -Include *.h,*.hpp -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'wificx|wlan' }
            foreach ($f in $all) {
              $raw = Get-Content $f.FullName -Raw
              foreach ($n in $names) {
                $m = [regex]::Match($raw, '(typedef\s+)?struct\s+_?' + $n + '\b\s*\{[\s\S]*?\}\s*(' + $n + '\b[^;]*)?;')
                if ($m.Success) { $out += ('#### ' + $f.Name + ' ' + $n); $out += (($m.Value -replace '\s+',' ')) }
              }
            }
            Emit "defs" ($out -join "`n")
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
