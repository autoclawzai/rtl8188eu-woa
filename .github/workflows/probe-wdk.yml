name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Toolset NetAdapter/WiFi references
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dirs = Get-ChildItem "$vs\MSBuild\Microsoft\VC" -Recurse -Directory -Filter "WindowsKernelModeDriver10.0" | Select-Object -First 1
          $files = Get-ChildItem $dirs.Parent.Parent.FullName -Recurse -File -Include *.props,*.targets,*.xml -ErrorAction SilentlyContinue
          $hits = $files | Select-String -Pattern 'NetAdapter|WiFiCx|Wificx|NETADAPTER' -List | ForEach-Object { $_.Path.Substring($vs.Length) + ':' + $_.LineNumber + ' ' + $_.Line.Trim() }
          $line = ($hits | Select-Object -First 60) -join ' ;; '
          $i = 0
          while ($line.Length -gt 0 -and $i -lt 8) {
            $n = [Math]::Min(3500, $line.Length)
            Write-Host "::notice title=hits$i::$($line.Substring(0,$n))"
            $line = $line.Substring($n); $i++
          }
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $ext = Get-ChildItem "$kits\build" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'NetAdapter|WiFi|wificx' } | ForEach-Object { $_.FullName.Substring($kits.Length) }
          Write-Host "::notice title=kitsbuild::$($ext -join ' ; ')"
