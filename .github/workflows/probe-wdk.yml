name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Signatures
        shell: pwsh
        run: |
          try {
            $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"
            $nl = [Environment]::NewLine
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 9) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            function Ctx([string]$file, [string]$pattern, [int]$after, [int]$max) {
              foreach ($pat in 'WDI_SIGNAL_INFO_CONTAINER;','WDI_CHANNEL_INFO_CONTAINER;','WDI_AGE_INFO_CONTAINER;') {
              $sel = Select-String -Path $f -Pattern ('\}\s*' + $pat.TrimEnd(';') + '\b') -Context 12,0 | Select-Object -First 1
              foreach ($x in $sel) { $out += ((($x.Context.PreContext + $x.Line) -join ' ') -replace '\s+',' ') }
              $sel2 = Select-String -Path $f -Pattern ('typedef\s+.*' + $pat.TrimEnd(';')) | Select-Object -First 2
              foreach ($x in $sel2) { $out += ('TD: ' + $x.Line.Trim()) }
            }
            Emit "grep" ($out -join "`n")
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
