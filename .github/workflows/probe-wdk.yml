name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Probe
        shell: pwsh
        run: |
          try {
            $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0"
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 9) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            $f = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0\TlvGenerated_.hpp"
            $raw = (Get-ChildItem $root -Include *.h,*.hpp -Recurse | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
            $out = @()
            $m = [regex]::Match($raw, 'typedef\s+struct\s+_?WDI_PHY_TYPE_LIST_CONTAINER\b[\s\S]*?\}\s*WDI_PHY_TYPE_LIST_CONTAINER\b[^;]*;')
            $out += ('## PHYLIST: ' + ($m.Value -replace '\s+',' '))
            $names = [regex]::Matches($raw,'\bWDI_PHY_TYPE_[A-Z0-9_]+') | ForEach-Object { $_.Value } | Sort-Object -Unique
            $out += ('## PHYNAMES: ' + ($names -join ' '))
            $m = [regex]::Match($raw, 'typedef\s+(struct|enum)[^;{]*\{[^}]*\}\s*WDI_PHY_TYPE\b[^;]*;')
            $out += ('## PHYTYPE: ' + ($m.Value -replace '\s+',' '))
            $names = [regex]::Matches($raw,'\bWDI_(AUTH_ALGO|CIPHER_ALGO|ASSOC_STATUS|DS_INFO)[A-Z0-9_]*') | ForEach-Object { $_.Value } | Sort-Object -Unique
            $out += ('## ENUMS: ' + ($names -join ' '))
            Emit "structs" ($out -join "`n")
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
