name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Probe
        shell: pwsh
        run: |
          $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0"
          $out = @()
          foreach ($f in (Get-ChildItem $root -Include *.h,*.hpp -Recurse)) {
            $m = Select-String -Path $f.FullName -Pattern 'GenerateWdiIndicationDisconnect|WDI_INDICATION_DISCONNECT\b|WDI_INDICATION_DISCONNECT_PARAMETERS|WDI_DISCONNECT_PARAMETERS_CONTAINER|WDI_INDICATION_ROAMING_NEEDED|WDI_DISCONNECT_REASON|WDI_ASSOC_STATUS_' | Select-Object -First 25
            foreach ($x in $m) { $out += ('@@ ' + $f.Name + ':' + $x.LineNumber + ' ' + ($x.Line -replace '\s+',' ')) }
          }
          $tf = Join-Path $root 'TlvGenerated_.hpp'
          $lines = Get-Content $tf
          for ($i=0; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match 'struct _WDI_DISCONNECT_PARAMETERS_CONTAINER|struct _WDI_INDICATION_DISCONNECT_PARAMETERS') {
              $out += ('## ' + $i + ' ' + (($lines[$i..($i+25)] | ForEach-Object { ($_ -replace '\s+',' ').Trim() }) -join ' '))
            }
          }
          $text = ($out -join "`n").Replace('%','%25').Replace("`n",'%0A')
          $i = 0
          while ($text.Length -gt 0 -and $i -lt 8) {
            $n = [Math]::Min(3600, $text.Length)
            Write-Host ("::notice title=probe#" + $i + "::" + $text.Substring(0,$n))
            $text = $text.Substring($n); $i++
          }
