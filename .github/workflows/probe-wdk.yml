name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: IDs and generated TLV functions
        shell: pwsh
        run: |
          $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"
          function Emit($title, $text) {
            $text = $text -replace '%','%25'
            $i = 0
            while ($text.Length -gt 0 -and $i -lt 9) {
              $n = [Math]::Min(3600, $text.Length)
              Write-Host "::notice title=$title#$i::$($text.Substring(0,$n))"
              $text = $text.Substring($n); $i++
            }
          }
          # message ids: lines with #define ... OID_WDI / WDI_ message id style
          $intf = Get-Content "$inc\dot11wificxintf.h" -Raw
          $m = [regex]::Matches($intf, '#define\s+(OID_WDI_[A-Z0-9_]+)\s+(\S+)') | ForEach-Object { $_.Groups[1].Value.Replace('OID_WDI_','') + '=' + $_.Groups[2].Value }
          Emit "ids" (($m | Select-Object -Unique) -join ',')
          $gen = Get-Content "$inc\wlan\2.0\TlvGenerated_.hpp" -Raw
          $g = [regex]::Matches($gen, '\b(Parse|Generate)(Wdi[A-Za-z0-9_]+)\s*\(') | ForEach-Object { $_.Groups[1].Value.Substring(0,1) + $_.Groups[2].Value.Replace('Wdi','') } | Select-Object -Unique
          Emit "gen" ($g -join ',')
