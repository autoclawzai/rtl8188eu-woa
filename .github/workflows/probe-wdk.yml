name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Probe
        shell: pwsh
        run: |
          try {
            $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0"
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 12) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            $files = Get-ChildItem $root -Include *.h,*.hpp -Recurse
            $names = @('WDI_SET_ADD_CIPHER_KEYS_PARAMETERS','WDI_SET_DELETE_CIPHER_KEYS_PARAMETERS','WDI_SET_DEFAULT_KEY_ID_PARAMETERS','WDI_TASK_DISCONNECT_PARAMETERS','WDI_SET_ADD_CIPHER_KEYS_CONTAINER','WDI_CIPHER_KEY_TYPE_INFO_CONTAINER','WDI_CIPHER_CCMP_KEY','WDI_CONNECT_PARAMETERS_CONTAINER','WDI_CIPHER_KEY_DIRECTION','WDI_CIPHER_KEY_TYPE')
            $out = @()
            foreach ($f in $files) {
              $lines = Get-Content $f.FullName
              for ($i=0; $i -lt $lines.Length; $i++) {
                foreach ($n in $names) {
                  if ($lines[$i] -match ('(struct|class|enum|typedef)\s+(_)?' + $n + '\b')) {
                    $end = [Math]::Min($lines.Length-1, $i+40)
                    $blk = @()
                    for ($j=$i; $j -le $end; $j++) { $blk += ($lines[$j] -replace '\s+',' '); if ($lines[$j] -match '^\s*\};?\s*$' -and $j -gt $i+1) { break } }
                    $out += ('## ' + $f.Name + ':' + $i + ' ' + ($blk -join ' | '))
                  }
                }
              }
            }
            $msg = Get-ChildItem $root -Include *.h,*.hpp -Recurse | Select-String -Pattern 'WDI_SET_ADD_CIPHER_KEYS\b|WDI_SET_DELETE_CIPHER_KEYS\b|WDI_SET_DEFAULT_KEY_ID\b|ParseWdiSetAddCipherKeysToIhv|ParseWdiSetDeleteCipherKeysToIhv|ParseWdiSetDefaultKeyIdToIhv|ParseWdiTaskDisconnectToIhv|CleanupParsedWdiSetAddCipherKeys' | Select-Object -First 30 | ForEach-Object { '@@ ' + $_.Filename + ':' + $_.LineNumber + ' ' + ($_.Line -replace '\s+',' ') }
            Emit "structs" (($out + $msg) -join "`n")
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
