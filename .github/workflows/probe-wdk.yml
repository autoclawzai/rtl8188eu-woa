name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Probe
        shell: pwsh
        run: |
          try {
            $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0"
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 9) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            $f = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0\TlvGenerated_.hpp"
            $raw = Get-Content $f -Raw
            $names = @('WDI_CONNECT_PARAMETERS_CONTAINER','WDI_ASSOCIATION_RESULT_PARAMETERS_CONTAINER','WDI_LINK_STATE_CHANGE_PARAMETERS_CONTAINER','WDI_DISCONNECT_PARAMETERS_CONTAINER','WDI_SET_ADD_CIPHER_KEYS_PARAMETERS','WDI_CIPHER_KEY_CONTAINER','WDI_SET_DELETE_CIPHER_KEYS_PARAMETERS','WDI_SET_DEFAULT_KEY_ID_PARAMETERS')
            $out = @()
            foreach ($n in $names) {
              $m = [regex]::Match($raw, 'typedef\s+struct\s+_?' + $n + '\b[\s\S]*?\}\s*' + $n + '\b[^;]*;')
              if ($m.Success) {
                $t = $m.Value
                $t = [regex]::Replace($t, '#ifdef __cplusplus[\s\S]*?#else[^\n]*\n[\s\S]*?#endif[^\n]*\n', '')   # array typedef pairs
                $t = [regex]::Replace($t, '#ifdef __cplusplus[\s\S]*?#endif[^\n]*\n', '')
                $t = [regex]::Replace($t, '//[^\n]*', '')
                $out += ('## ' + $n + ': ' + ($t -replace '\s+',' '))
              } else { $out += ('## ' + $n + ': NOT FOUND') }
            }
            $cand = [regex]::Matches($raw,'\}\s*(WDI_[A-Z0-9_]*(CIPHER|KEY|CONNECT_PARAM|ASSOCIATION_RESULT)[A-Z0-9_]*)\b') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            $out += ('## CANDIDATES: ' + ($cand -join ' '))
            Emit "structs" ($out -join "`n")
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
