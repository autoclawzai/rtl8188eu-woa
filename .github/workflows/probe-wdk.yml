name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: List
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0"
          $all = Get-ChildItem $kits -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'wificx|wlan|wdi|dot11' -and $_.Extension -in '.h','.hpp','.hxx' }
          $rel = $all | ForEach-Object { $_.FullName.Substring($kits.Length+1) + '(' + $_.Length + ')' }
          $line = ($rel -join ' ; ')
          $i = 0
          while ($line.Length -gt 0 -and $i -lt 9) {
            $n = [Math]::Min(3500, $line.Length)
            Write-Host "::notice title=files$i::$($line.Substring(0,$n))"
            $line = $line.Substring($n); $i++
          }
