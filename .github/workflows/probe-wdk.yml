name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Probe
        shell: pwsh
        run: |
          try {
            $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0"
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 9) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            $f = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0\TlvGenerated_.hpp"
            $raw = (Get-ChildItem $root -Include *.h,*.hpp -Recurse | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
            $fn = [regex]::Matches($raw,'\b(Generate|Parse|CleanupParsed)Wdi[A-Za-z0-9_]*(Association|LinkState|Connect|Disconnect|Cipher|DefaultKey|Roam)[A-Za-z0-9_]*\s*\([^)]*\)') | ForEach-Object { ($_.Value -replace '\s+',' ') } | Sort-Object -Unique
            $out = @('## FUNCS: ' + ($fn -join ' ;; '))
            $m = [regex]::Match($raw, 'typedef\s+struct\s+_?WDI_ASSOCIATION_RESULT_CONTAINER\b[\s\S]*?\}\s*WDI_ASSOCIATION_RESULT_CONTAINER\b[^;]*;')
            $out += ('## ASSOC: ' + ($m.Value -replace '\s+',' '))
            $m = [regex]::Match($raw, 'typedef\s+struct\s+_?WDI_LINK_STATE_CHANGE_PARAMETERS\w*\b[\s\S]*?\}\s*\w+\b[^;]*;')
            $out += ('## LINK: ' + ($m.Value -replace '\s+',' '))
            $m = [regex]::Match($raw, 'typedef\s+struct\s+_?WDI_TASK_CONNECT_PARAMETERS\b[\s\S]*?\}\s*WDI_TASK_CONNECT_PARAMETERS\b[^;]*;')
            $out += ('## CONN: ' + ($m.Value -replace '\s+',' '))
            $m = [regex]::Match($raw, 'typedef\s+struct\s+_?WDI_INDICATION_ASSOCIATION_RESULT\w*\b[\s\S]*?\}\s*\w+\b[^;]*;')
            $out += ('## IND_ASSOC: ' + ($m.Value -replace '\s+',' '))
            $m = [regex]::Match($raw, 'typedef\s+struct\s+_?WDI_INDICATION_DISCONNECT\w*\b[\s\S]*?\}\s*\w+\b[^;]*;')
            $out += ('## IND_DISC: ' + ($m.Value -replace '\s+',' '))
            Emit "structs" ($out -join "`n")
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
