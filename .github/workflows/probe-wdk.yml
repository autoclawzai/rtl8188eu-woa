name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Probe
        shell: pwsh
        run: |
          try {
            $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km\wlan\2.0"
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 9) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            $km = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"
            $out = @()
            $files = Get-ChildItem $km -Recurse -File -Include dot11wificx*.h,dot11wificx*.hpp,*.h -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'wificx|wlan' }
            foreach ($file in $files) {
              $raw = Get-Content $file.FullName -Raw
              foreach ($n in 'WDI_SIGNAL_INFO','WDI_BSS_ENTRY_CHANNEL_INFO','WDI_BSS_ENTRY_AGE_INFO','WDI_BAND_ID','WDI_CHANNEL_MAPPING_ENTRY') {
                $m = [regex]::Match($raw, 'typedef\s+(struct|enum)\s+_?' + $n + '\b[\s\S]*?\}\s*' + $n + '\b[^;]*;')
                if ($m.Success) { $out += ('## ' + $file.Name + ': ' + ($m.Value -replace '\s+',' ')) }
              }
            }
            Emit "defs" ($out -join "`n")
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
