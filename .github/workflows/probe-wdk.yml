name: probe-wdk
on:
  push:
    paths: [ '.github/workflows/probe-wdk.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Signatures
        shell: pwsh
        run: |
          try {
            $inc = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\km"
            $nl = [Environment]::NewLine
            function Emit([string]$title, [string]$text) {
              $text = $text.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
              $i = 0
              while ($text.Length -gt 0 -and $i -lt 9) {
                $n = [Math]::Min(3600, $text.Length)
                Write-Host ("::notice title=" + $title + "#" + $i + "::" + $text.Substring(0,$n))
                $text = $text.Substring($n); $i++
              }
            }
            function Ctx([string]$file, [string]$pattern, [int]$after, [int]$max) {
              $sel = Select-String -Path $file -Pattern $pattern -Context 0,$after | Select-Object -First $max
              $parts = @()
              foreach ($s in $sel) {
                $t = ($s.Line + ' ' + ($s.Context.PostContext -join ' ')) -replace '\s+',' '
                $parts += ('@@ ' + $t.Trim())
              }
              return ($parts -join "`n")
            }

            $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0"
            $hits = Get-ChildItem $root -Recurse -File -Include *.h -ErrorAction SilentlyContinue | Select-String -Pattern 'NET_EUI48_ADDRESS' | Where-Object { $_.Line -match 'typedef|struct|define' } | Select-Object -First 12
            Emit "eui48" (($hits | ForEach-Object { $_.Path.Replace($root,'') + ':' + $_.LineNumber + ': ' + $_.Line.Trim() }) -join "`n")
            $f1 = Get-ChildItem $root -Recurse -File -Filter 'netiodef.h' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Replace($root,'') }
            Emit "netiodef" ($f1 -join "`n")
            $d = Get-ChildItem $root -Recurse -File -Filter 'ifdef.h' -ErrorAction SilentlyContinue | Select-Object -First 3
            foreach ($x in $d) { Emit ("ifdef " + $x.FullName.Replace($root,'')) (Ctx $x.FullName 'NET_EUI48_ADDRESS' 3 6) }
          } catch { Write-Host ("::error title=probe::" + ($_ | Out-String).Replace("`n",' ')); exit 1 }
