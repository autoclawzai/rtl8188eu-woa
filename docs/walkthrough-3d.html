  var N = slides.length, SP = 80, cur = 0, enter = 0, selected = null;
  slides.forEach(function (s, k) { s.g.position.x = k * SP; scene.add(s.g); });
  var camPos = new THREE.Vector3(), camTgt = new THREE.Vector3(), px = 0, py = 0, tpx = 0, tpy = 0;
  var el = { kick: document.getElementById('kick'), ttl: document.getElementById('ttl'), body: document.getElementById('body'), extra: document.getElementById('extra'), info: document.getElementById('info'), cnt: document.getElementById('cnt'), dots: document.getElementById('dots') };
  slides.forEach(function (s, k) {
    var b = document.createElement('button'); b.setAttribute('aria-label', 'Slide ' + (k + 1)); b.onclick = function () { go(k); }; el.dots.appendChild(b);
  });
  function setInfo(i) {
    el.info.innerHTML = '';
    if (!i) { var has = items.some(function (m) { return m.userData.slide === cur; }); var h = document.createElement('p'); h.className = 'hint'; h.textContent = has ? 'Scene mein kisi object par click karo.' : ''; el.info.appendChild(h); el.info.style.display = has ? '' : 'none'; return; }
    el.info.style.display = '';
    var t = document.createElement('h2'); t.textContent = i.t; var p = document.createElement('p'); p.textContent = i.x; el.info.appendChild(t); el.info.appendChild(p);
  }
  function go(k, instant) {
    k = (k + N) % N; cur = k; enter = 0; selected = null;
    items.forEach(function (m) { m.scale.copy(m.userData.base); });
    var s = slides[k];
    el.kick.textContent = s.kick; el.ttl.textContent = s.title; el.body.innerHTML = s.body; el.extra.innerHTML = s.extra || '';
    setInfo(null); if (s.onShow) s.onShow();
    el.cnt.textContent = String(k + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0');
    var ds = el.dots.children; for (var q = 0; q < ds.length; q++) ds[q].setAttribute('aria-current', q === k ? 'true' : 'false');
    try { history.replaceState(null, '', '#s' + (k + 1)); } catch (e) {}
    if (instant) { camPos.set(k * SP + s.cam[0], s.cam[1], s.cam[2]); camTgt.set(k * SP + s.tgt[0], s.tgt[1], s.tgt[2]); }
  }
  document.getElementById('prev').onclick = function () { go(cur - 1); };
  document.getElementById('next').onclick = function () { go(cur + 1); };
  addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1); else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1); });

  /* picking */
  var ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), down = null, hover = null;
  function pick(e) {
    var r = cv.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    var hit = ray.intersectObjects(items.filter(function (m) { return m.userData.slide === cur; }), false)[0]; return hit ? hit.object : null;
  }

  cv.addEventListener('pointerup', function (e) {

    var o = pick(e); items.forEach(function (m) { m.scale.copy(m.userData.base); }); selected = o;
    if (o) { o.scale.copy(o.userData.base).multiplyScalar(1.18); setInfo(o.userData.info); } else setInfo(null);
  });
  cv.addEventListener('pointermove', function (e) {
    tpx = (e.clientX / innerWidth - 0.5); tpy = (e.clientY / innerHeight - 0.5);

  });

  /* resize with the scene shifted clear of the panel */
  function resize() {
    var w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
    var narrow = w <= 760, off = narrow ? 0 : Math.min(400, w * 0.36) / 2 + 8, offY = narrow ? h * 0.2 : 0;
    camera.setViewOffset(w, h, -off, offY, w, h); camera.fov = narrow ? 58 : 42; camera.updateProjectionMatrix();

  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  var t0 = performance.now(), last = t0;

    var dt = Math.min(0.05, (now - last) / 1000); last = now; var t = RM ? 0.001 : Math.max(0.001, (now - t0) / 1000); enter += dt;
    var s = slides[cur];
    var k = RM ? 1 : 1 - Math.pow(0.0009, dt);
    px += (tpx - px) * 0.05; py += (tpy - py) * 0.05;
    var wp = new THREE.Vector3(cur * SP + s.cam[0] + (RM ? 0 : px * 1.6), s.cam[1] - (RM ? 0 : py * 0.9), s.cam[2]);
    camPos.lerp(wp, k); camTgt.lerp(new THREE.Vector3(cur * SP + s.tgt[0], s.tgt[1], s.tgt[2]), k);
    camera.position.copy(camPos); camera.lookAt(camTgt);
    slides.forEach(function (sl, idx) { if (Math.abs(idx - cur) <= 1) sl.update(t, idx === cur ? enter : 99); });
    items.forEach(function (m) { if (m !== selected && m.userData.slide === cur) { var tgt = (m === hover) ? 1.08 : 1; m.scale.x += (m.userData.base.x * tgt - m.scale.x) * 0.2; m.scale.z += (m.userData.base.z * tgt - m.scale.z) * 0.2; if (!m.userData.bar) m.scale.y += (m.userData.base.y * tgt - m.scale.y) * 0.2; } });
    renderer.render(scene, camera);
    var w = innerWidth, h = innerHeight;
    labels.forEach(function (L) {
      if (L.slide !== cur) { L.el.style.opacity = 0; return; }

      L.el.style.opacity = 1; L.el.style.transform = 'translate(-50%,-50%) translate(' + ((tmpV.x * 0.5 + 0.5) * w).toFixed(1) + 'px,' + ((-tmpV.y * 0.5 + 0.5) * h + L.dy).toFixed(1) + 'px)';

  var start = 0; try { var m = /^#s(\d+)$/.exec(location.hash); if (m) start = Math.min(N, Math.max(1, +m[1])) - 1; } catch (e) {}
  go(start, true); requestAnimationFrame(frame);
})();
